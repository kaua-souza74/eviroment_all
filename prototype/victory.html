<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18331d">
  <title>Vitória · Enviroment All</title>
  <style>
    :root { color-scheme: light; font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif; color: #70452d; background: #10291a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #10291a; }
    button, a { font: inherit; }
    .stage {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: min(100%, 430px);
      min-height: 100svh;
      margin: 0 auto;
      overflow: hidden;
      background: #12321f url("../assets/screens/victory-background.png") center / cover no-repeat;
      --board-width: min(76vw, 320px);
    }
    .leaf-layer { position: absolute; z-index: 2; inset: 0; overflow: hidden; pointer-events: none; }
    .falling-leaf { position: absolute; top: -12%; left: var(--left); width: clamp(17px, 5vw, 25px); height: auto; opacity: 0; animation: leaf-fall var(--duration) linear var(--delay) infinite; }
    .victory-layout { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: clamp(8px, 1.4svh, 12px); width: 100%; min-height: 100svh; padding: 0 0 max(8px, env(safe-area-inset-bottom)); }
    .victory-board { position: relative; z-index: 2; flex: 0 0 auto; width: var(--board-width); aspect-ratio: 2 / 3; animation: board-entry 760ms cubic-bezier(.18,.83,.26,1.14) both; }
    .board-art { display: block; width: 100%; height: 100%; object-fit: contain; }
    .victory-title { position: absolute; top: 37.5%; left: 10%; right: 10%; margin: 0; color: #ffb83f; text-align: center; font-family: "Trebuchet MS", system-ui, sans-serif; font-size: clamp(24px, 6.6vw, 30px); line-height: 1.05; font-weight: 900; letter-spacing: -.025em; text-shadow: 0 2px 0 #854318; animation: title-pop 520ms cubic-bezier(.16,.82,.23,1.2) 300ms both; }
    .level { position: absolute; top: 43.8%; left: 50%; display: flex; align-items: center; justify-content: center; width: max-content; min-width: 98px; padding: 3px 13px; margin: 0; transform: translateX(-50%); border: 1px solid #c87935; border-radius: 999px; color: #743d1e; background: #ffe4a0; box-shadow: inset 0 1px 0 #fff9d9, 0 2px 3px #8c4a2570; text-align: center; font-family: "Trebuchet MS", system-ui, sans-serif; font-size: clamp(15px, 4vw, 18px); line-height: 1.1; font-weight: 1000; letter-spacing: .06em; text-transform: uppercase; text-shadow: none; }
    .reward-card { position: absolute; top: 49.5%; left: 17%; right: 17%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 16%; padding: 4px 7px; border: 2px solid #fff0c6; border-radius: 18px; color: #885135; background: #e7cf91; box-shadow: inset 0 1px 2px #fff9d7; }
    .reward-card h2 { margin: 0; font-size: clamp(13px, 3.8vw, 17px); line-height: 1.15; }
    .reward-icons { display: block; width: clamp(90px, 30vw, 118px); max-height: 38px; object-fit: contain; }
    .reward-values { display: flex; justify-content: center; gap: 12px; margin: 0; font-size: clamp(11px, 3.35vw, 14px); font-weight: 900; white-space: nowrap; }
    .image-button { position: absolute; left: 22%; width: 56%; height: 9.2%; display: grid; place-items: center; padding: 0 8px; border: 0; border-radius: 26px; color: white; font-family: "Trebuchet MS", system-ui, sans-serif; font-size: clamp(15px, 4.7vw, 21px); font-weight: 900; letter-spacing: -.015em; text-shadow: 0 2px 2px #28522a; text-decoration: none; background-position: center; background-size: 100% 100%; background-repeat: no-repeat; cursor: pointer; transform-origin: center; animation: button-idle 2.4s ease-in-out 750ms infinite; transition: filter 120ms ease, transform 120ms ease; }
    .image-button:hover { animation-play-state: paused; filter: brightness(1.08); transform: translateY(-1px) scale(1.025); }
    .image-button:active { transform: translateY(2px); }
    .image-button:focus-visible { outline: 3px solid #fff4a2; outline-offset: 2px; }
    .next { top: 68.5%; background-image: url("../assets/ui/button-green-v2.png"); }
    .home { top: 80%; background-image: url("../assets/ui/button-blue-v2.png"); }
    .controls { position: relative; width: min(88vw, 374px); aspect-ratio: 2172 / 724; animation: controls-entry 520ms ease-out 420ms both; }
    .controls-art { display: block; width: 100%; height: 100%; object-fit: contain; }
    .control-actions { position: absolute; top: 14%; left: 9%; right: 9%; height: 48%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .icon-hit { justify-self: center; align-self: center; width: min(100%, 60px); aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%; color: transparent; background: transparent; background-position: center; background-size: contain; background-repeat: no-repeat; cursor: pointer; }
    .icon-hit[data-toggle="sound"][aria-pressed="false"], .icon-hit[data-toggle="music"][aria-pressed="false"] { width: min(116%, 72px); background-size: 100% 100%; }
    .icon-hit[data-toggle="sound"][aria-pressed="false"] { background-image: url("../assets/ui/sound-off-red-v2.png"); }
    .icon-hit[data-toggle="music"][aria-pressed="false"] { background-image: url("../assets/ui/music-off-red-v2.png"); }
    .icon-hit:focus-visible { outline: 3px solid #fff5a6; outline-offset: -2px; }
    .control-labels { position: absolute; left: 10%; right: 10%; bottom: 20%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; color: #855032; text-align: center; font-size: clamp(8px, 2.3vw, 10px); line-height: 1; font-weight: 900; pointer-events: none; }
    .status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    dialog { width: min(86vw, 340px); padding: 22px; border: 4px solid #8c512e; border-radius: 24px; color: #70452d; text-align: center; background: #fff0c6; box-shadow: 0 12px 28px #10251d99; }
    dialog::backdrop { background: #10251d9c; }
    dialog h2 { margin: 0 0 8px; font-size: 22px; }
    dialog p { margin: 0 0 16px; font-size: 14px; line-height: 1.45; }
    .dialog-button { min-height: 42px; padding: 8px 18px; border: 0; border-radius: 22px; color: white; font-weight: 800; background: #168fc7; cursor: pointer; }
    @media (max-height: 700px) { .victory-layout { gap: 8px; padding-top: 0; padding-bottom: 8px; } .victory-board { width: min(76vw, 320px); } .controls { width: min(78vw, 330px); } }
    @media (max-height: 620px) { .victory-layout { gap: 6px; } .victory-board { width: min(66vw, 280px); } .controls { width: min(70vw, 300px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } .falling-leaf { display: none; } }
    @keyframes board-entry { 0% { opacity: 0; transform: translateY(-34px) scale(.93); } 72% { opacity: 1; transform: translateY(3px) scale(1.015); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes title-pop { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 75% { opacity: 1; transform: translateY(-2px) scale(1.04); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes controls-entry { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes button-idle { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.035); } }
    @keyframes leaf-fall { 0% { opacity: 0; transform: translate3d(0, 0, 0) rotate(0); } 12% { opacity: .82; } 86% { opacity: .82; } 100% { opacity: 0; transform: translate3d(var(--drift), 112svh, 0) rotate(var(--turn)); } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="leaf-layer" aria-hidden="true">
      <img class="falling-leaf" src="../assets/ui/falling-leaf.png" alt="" style="--left:7%;--duration:13s;--delay:-4s;--drift:34px;--turn:320deg">
      <img class="falling-leaf" src="../assets/ui/falling-leaf.png" alt="" style="--left:31%;--duration:16s;--delay:-10s;--drift:-22px;--turn:-330deg">
      <img class="falling-leaf" src="../assets/ui/falling-leaf.png" alt="" style="--left:76%;--duration:12s;--delay:-7s;--drift:28px;--turn:280deg">
      <img class="falling-leaf" src="../assets/ui/falling-leaf.png" alt="" style="--left:94%;--duration:15s;--delay:-12s;--drift:-26px;--turn:-300deg">
    </div>
    <section class="victory-layout" aria-label="Resumo da fase concluída">
      <div class="victory-board">
        <img class="board-art" src="../assets/ui/victory-board-rope-v2.png" alt="">
        <h1 class="victory-title">Você venceu!</h1>
        <p class="level">Fase 15</p>
        <section class="reward-card" aria-label="Recompensas recebidas">
          <h2>Suas recompensas</h2>
          <img class="reward-icons" src="../assets/ui/reward-icons.png" alt="Moeda de folha e cristal azul">
          <p class="reward-values"><span>500 moedas</span><span>50 cristais</span></p>
        </section>
        <a class="image-button next" href="menu.html">Próxima fase</a>
        <a class="image-button home" href="menu.html">Início</a>
      </div>
      <div class="controls">
        <img class="controls-art" src="../assets/ui/victory-controls.png" alt="">
        <div class="control-actions" aria-label="Controles">
          <button class="icon-hit" type="button" aria-label="Desligar som" aria-pressed="true" data-toggle="sound">Som</button>
          <button class="icon-hit" type="button" aria-label="Desligar música" aria-pressed="true" data-toggle="music">Música</button>
          <button class="icon-hit" type="button" aria-label="Ajuda" data-toggle="help">Ajuda</button>
          <button class="icon-hit" type="button" aria-label="Repetir fase" data-toggle="replay">Repetir</button>
        </div>
        <div class="control-labels" aria-hidden="true"><span id="soundLabel">Som</span><span id="musicLabel">Música</span><span>Ajuda</span><span>Repetir</span></div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <dialog id="helpDialog" aria-labelledby="helpTitle">
    <h2 id="helpTitle">Boa prática desbloqueada!</h2>
    <p>Revise as escolhas da fase e veja como pequenas ações ajudam a reduzir resíduos e poluição.</p>
    <button class="dialog-button" type="button" id="closeHelp">Entendi</button>
  </dialog>
  <script>
    const status = document.querySelector("#status");
    const helpDialog = document.querySelector("#helpDialog");
    document.querySelectorAll("[data-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const action = button.dataset.toggle;
        if (action === "help") { helpDialog.showModal(); return; }
        if (action === "replay") { window.location.reload(); return; }
        const enabled = button.getAttribute("aria-pressed") !== "true";
        button.setAttribute("aria-pressed", String(enabled));
        const label = action === "sound" ? document.querySelector("#soundLabel") : document.querySelector("#musicLabel");
        label.textContent = enabled ? (action === "sound" ? "Som" : "Música") : (action === "sound" ? "Som off" : "Música off");
        button.setAttribute("aria-label", `${enabled ? "Desligar" : "Ligar"} ${action === "sound" ? "som" : "música"}`);
        status.textContent = `${action === "sound" ? "Som" : "Música"} ${enabled ? "ligado" : "desligado"}.`;
      });
    });
    document.querySelector("#closeHelp").addEventListener("click", () => helpDialog.close());
    helpDialog.addEventListener("click", (event) => { if (event.target === helpDialog) helpDialog.close(); });
  </script>
</body>
</html>
