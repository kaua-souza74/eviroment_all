name: enviroment_all
description: Jogo educativo de aventura sobre cuidado com o meio ambiente.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/screens/
    - assets/ui/
    - assets/music/
    - assets/audio/
